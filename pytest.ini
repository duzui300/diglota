[pytest]
# `tools/ui_test.py` is a browser driver, not a pytest suite -- but its name
# matches pytest's default `*_test.py` glob, and it rebinds `sys.stdout` to a new
# TextIOWrapper at import time. Importing it therefore closes pytest's capture
# buffer, and a bare `python -m pytest` from the repo root dies with
# "I/O operation on closed file" before a single test runs. Pointing pytest at
# `tests/` keeps the obvious command working.
testpaths = tests
